[workspace]
authors = ["wangyong233 <wangyong233@midea.com>"]
channels = ["https://prefix.dev/robostack-humble", "https://fast.prefix.dev/conda-forge"]
name = "quest3s_vr"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
scripts = ["install/setup.bash"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"

[dependencies]
python = ">=3.9, <3.11"
python-can = "*"
compilers = "*"
cmake = ">=3.8, <3.16"
make = "*"
ninja = "*"
setuptools = "<80.0"
ros-humble-desktop = "*"
colcon-common-extensions = "*"
rosdep = "*"
transforms3d = "*"
aiohttp = "==3.10.5"
ros-humble-rmw-fastrtps-cpp = ">=6.2.1,<7"
foonathan-memory = "==0.7.1"
pinocchio = ">=2.6.9,<3"
scipy = ">=1.13.1,<2"

[pypi-dependencies]
vuer = { version = ">=0.0.36rc1", extras = ["all"] }

[pypi-options]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
extra-index-urls = ["https://pypi.org/simple"]


